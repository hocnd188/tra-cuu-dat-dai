<!doctype html><html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quản trị người dùng</title>
<style>
 body{margin:0;font-family:system-ui,Arial;background:#eef2f5;color:#25313f}
 header{background:#1b7a43;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
 header h1{font-size:16px;margin:0}header a{color:#fff;font-size:13px;text-decoration:none;margin-left:14px}
 .wrap{max-width:820px;margin:18px auto;padding:0 14px}
 .card{background:#fff;border:1px solid #dfe5ea;border-radius:12px;padding:16px;margin-bottom:16px}
 h2{font-size:15px;margin:0 0 12px}
 table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid #eef1f4}
 th{font-size:12px;color:#657;text-transform:uppercase}
 .tag{font-size:11px;padding:2px 8px;border-radius:10px;background:#e7f5ec;color:#1b7a43;font-weight:700}
 input,select{padding:9px 10px;border:1px solid #cfd6dd;border-radius:8px;font-size:14px}
 .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
 button{padding:9px 13px;border:0;border-radius:8px;background:#1b7a43;color:#fff;font-weight:700;cursor:pointer;font-size:14px}
 button.sec{background:#e6eaef;color:#25313f}button.danger{background:#b0361f;color:#fff}
 .msg{font-size:13px;margin-top:10px;min-height:18px}.err{color:#b0361f}.ok{color:#1b7a43}
 .act{display:flex;gap:6px}
</style></head><body>
<header><h1>⚙ Quản trị người dùng</h1><div><a href="/">← Về ứng dụng</a><a href="#" id="lo">Đăng xuất</a></div></header>
<div class="wrap">
 <div class="card"><h2>Thêm người dùng</h2>
   <div class="row">
     <input id="nu" placeholder="Tên đăng nhập">
     <input id="np" type="password" placeholder="Mật khẩu (≥6 ký tự)">
     <label class="row" style="gap:6px;font-size:14px"><input type="checkbox" id="na"> là admin</label>
     <button id="add">Thêm</button>
   </div><div class="msg" id="m1"></div>
 </div>
 <div class="card"><h2>Danh sách người dùng</h2>
   <table><thead><tr><th>ID</th><th>Tên đăng nhập</th><th>Vai trò</th><th>Tạo lúc</th><th></th></tr></thead>
   <tbody id="tb"><tr><td colspan="5" style="color:#889">Đang tải...</td></tr></tbody></table>
   <div class="msg" id="m2"></div>
 </div>
</div>
<script>
let me=null;
fetch("/api/me").then(r=>r.json()).then(u=>{me=u;}).catch(()=>{});
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function load(){
  fetch("/api/users").then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error||"Lỗi");return d;})
   .then(d=>{const tb=document.getElementById("tb");tb.innerHTML=d.users.map(u=>
     `<tr><td>${u.id}</td><td>${esc(u.username)}</td><td>${u.is_admin?'<span class="tag">admin</span>':'người dùng'}</td>
      <td style="font-size:12px;color:#789">${esc((u.created_at||"").slice(0,10))}</td>
      <td><div class="act"><button class="sec" onclick="resetPw(${u.id},'${esc(u.username)}')">Đổi MK</button>
      <button class="danger" onclick="delUser(${u.id},'${esc(u.username)}')">Xóa</button></div></td></tr>`).join("")
      ||'<tr><td colspan="5" style="color:#889">Chưa có ai</td></tr>';})
   .catch(e=>{document.getElementById("m2").textContent=e.message;document.getElementById("m2").className="msg err";});
}
document.getElementById("add").onclick=function(){
  const nu=document.getElementById("nu").value.trim(),np=document.getElementById("np").value,na=document.getElementById("na").checked;
  const m=document.getElementById("m1");m.textContent="";m.className="msg";
  fetch("/api/users",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:nu,password:np,is_admin:na})})
   .then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error||"Lỗi");return d;})
   .then(()=>{m.textContent="Đã thêm "+nu;m.className="msg ok";document.getElementById("nu").value="";document.getElementById("np").value="";document.getElementById("na").checked=false;load();})
   .catch(e=>{m.textContent=e.message;m.className="msg err";});
};
function delUser(id,name){if(!confirm("Xóa người dùng "+name+"?"))return;
  fetch("/api/users/"+id,{method:"DELETE"}).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error||"Lỗi");}).then(load)
   .catch(e=>{document.getElementById("m2").textContent=e.message;document.getElementById("m2").className="msg err";});}
function resetPw(id,name){const p=prompt("Mật khẩu mới cho "+name+" (≥6 ký tự):");if(!p)return;
  fetch("/api/users/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:p})})
   .then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error||"Lỗi");}).then(()=>{document.getElementById("m2").textContent="Đã đổi mật khẩu cho "+name;document.getElementById("m2").className="msg ok";})
   .catch(e=>{document.getElementById("m2").textContent=e.message;document.getElementById("m2").className="msg err";});}
document.getElementById("lo").onclick=function(e){e.preventDefault();fetch("/api/logout",{method:"POST"}).then(()=>location.href="/login.html");};
load();
</script></body></html>
