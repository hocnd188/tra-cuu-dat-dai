<!doctype html><html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng nhập · Pháp luật đất đai</title>
<style>
 body{margin:0;font-family:system-ui,Arial;background:#eef2f5;display:flex;min-height:100vh;align-items:center;justify-content:center}
 .card{background:#fff;border:1px solid #dfe5ea;border-radius:14px;box-shadow:0 8px 30px rgba(20,25,35,.12);padding:26px 22px;width:min(360px,92vw)}
 h1{font-size:18px;color:#1b7a43;margin:0 0 4px}.sub{font-size:13px;color:#657;margin:0 0 18px}
 label{display:block;font-size:13px;color:#334;margin:12px 0 6px;font-weight:600}
 input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #cfd6dd;border-radius:9px;font-size:15px}
 button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:9px;background:#1b7a43;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
 button:active{transform:scale(.99)}.msg{margin-top:12px;font-size:13px;min-height:18px}.err{color:#b0361f}.ok{color:#1b7a43}
</style></head><body>
<div class="card">
 <h1 id="ttl">Đăng nhập</h1>
 <p class="sub" id="sub">Tra cứu pháp luật đất đai</p>
 <label>Tên đăng nhập</label><input id="u" autocomplete="username">
 <label>Mật khẩu</label><input id="p" type="password" autocomplete="current-password">
 <button id="btn">Đăng nhập</button>
 <div class="msg" id="msg"></div>
</div>
<script>
let setupMode=false;
fetch("/api/setup").then(r=>r.json()).then(d=>{
  if(d.needsSetup){setupMode=true;document.getElementById("ttl").textContent="Tạo tài khoản admin";
    document.getElementById("sub").textContent="Lần đầu: đặt tài khoản quản trị cho bạn";
    document.getElementById("btn").textContent="Tạo admin";}
}).catch(()=>{});
function submit(){
  const u=document.getElementById("u").value.trim(), p=document.getElementById("p").value;
  const msg=document.getElementById("msg"); msg.textContent=""; msg.className="msg";
  if(!u||!p){msg.textContent="Nhập đủ tài khoản và mật khẩu";msg.className="msg err";return;}
  const url=setupMode?"/api/setup":"/api/login";
  fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,password:p})})
   .then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Lỗi");return d;})
   .then(d=>{
      if(setupMode){msg.textContent="Đã tạo admin. Đang đăng nhập...";msg.className="msg ok";
        return fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,password:p})}).then(()=>location.href="/");}
      location.href="/";
   }).catch(e=>{msg.textContent=e.message;msg.className="msg err";});
}
document.getElementById("btn").onclick=submit;
document.getElementById("p").addEventListener("keydown",e=>{if(e.key==="Enter")submit();});
</script></body></html>
